<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة خاصة - عبد الرحمن & عائشة</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Arabic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            overflow-x: hidden;
        }

        .font-amiri {
            font-family: 'Amiri', serif;
        }

        .font-kufi {
            font-family: 'Reem Kufi', sans-serif;
        }

        /* Glassmorphism card effect */
        .glass-card {
            background: rgba(249, 247, 238, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Gold gradient text */
        .text-gold-gradient {
            background: linear-gradient(135deg, #a67452 0%, #8c5d3d 50%, #6e472e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-black-gradient {
            background: linear-gradient(135deg, #000000 0%, #000000 50%, #308108 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Animated shimmer button */
        .gold-btn {
            background: linear-gradient(135deg, #c59b57 0%, #bd8e4e 50%, #c6954d 100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(231, 178, 64, 0.648);
        }

        .gold-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        /* Subtle floating keyframes */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .floating {
            animation: floatSlow 5s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-amber-500 selection:text-black">

    <!-- Blurred Venue Background Layer -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img 
            src="hero-poster.jpg" 
            alt="صالة الحفل" 
            class="w-full h-full object-cover scale-105 filter blur-xs brightness-50"
            onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1920&q=80';"
        >
        <!-- Overlay Dark Gradient for Contrast -->
        <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/40 to-black/80"></div>
    </div>

    <!-- Main Container -->
    <main class="relative z-10 container mx-auto px-4 py-8 md:py-12 flex-grow flex flex-col items-center justify-center max-w-3xl text-center">
        
        <!-- Main Card Envelope View -->
        <div class="w-full glass-card rounded-3xl p-6 sm:p-10 md:p-12 relative overflow-hidden my-auto border border-amber-500/30">
            
            <!-- Corner Decorative Elements -->
            <div class="absolute top-3 right-3 w-8 h-8 border-t-2 border-r-2 rounded-tr-xl pointer-events-none" style="border-color: #6a4f2b;"></div>
            <div class="absolute top-3 left-3 w-8 h-8 border-t-2 border-l-2 rounded-tl-xl pointer-events-none" style="border-color: #6a4f2b;"></div>
            <div class="absolute bottom-3 right-3 w-8 h-8 border-b-2 border-r-2 rounded-br-xl pointer-events-none" style="border-color: #6a4f2b;"></div>
            <div class="absolute bottom-3 left-3 w-8 h-8 border-b-2 border-l-2 rounded-bl-xl pointer-events-none" style="border-color: #6a4f2b;"></div>

            <!-- Logo Section -->
            <div class="mb-8 flex justify-center floating">
                <img 
                    src="WEDDING LOGO.png" 
                    alt="عبد الرحمن & عائشة" 
                    class="h-28 sm:h-36 md:h-44 object-contain filter drop-shadow-[0_4px_12px_rgba(212,175,55,0.4)] hover:scale-105 transition-transform duration-500"
                    onerror="this.onerror=null; this.src='https://placehold.co/400x200/transparent/d4af37?text=%D8%B9%D8%A8%D8%AF%D8%A7%D9%84%D8%B1%D8%AD%D9%85%D9%86+%26+%D8%B9%D8%A7%D8%A6%D8%B4%D8%A9';"
                >
            </div>

            <!-- Decorative Divider -->
            <div class="flex items-center justify-center gap-3 my-4">
                <div class="h-[1px] w-12 sm:w-20 bg-gradient-to-r from-transparent to-[#6a4f2b]"></div>
                <i class="fa-solid fa-heart text-sm" style="color: #6a4f2b;"></i>
                <div class="h-[1px] w-12 sm:w-20 bg-gradient-to-l from-transparent to-[#6a4f2b]"></div>
            </div>

            <!-- Main Invitation Texts -->
            <div class="space-y-3 my-6">
                <h1 class="font-amiri text-3xl sm:text-4xl md:text-5xl text-black-gradient font-bold tracking-wide">
                    دعوة خاصة
                </h1>
                <p class="font-kufi text-2xl sm:text-3xl text-black-gradient font-medium tracking-wider">
                    حياكم الله
                </p>
            </div>

            <!-- Interactive Map Container -->
            <div class="mt-8 space-y-4">
                <div class="flex items-center justify-center gap-2 text-gold-gradient text-sm sm:text-base font-light mb-2">
                    <i class="fa-solid fa-location-dot text-gold-gradient animate-bounce"></i>
                    <span>موقع الحفل</span>
                </div>

                <!-- Google Maps Embed Iframe -->
                <div class="relative w-full h-64 sm:h-72 rounded-2xl overflow-hidden border border-amber-500/30 shadow-2xl group">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d3648.8777787771105!2d55.513877!3d25.3172105!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ef5f5be00a18829%3A0x1a260e921cfb3780!2sAl%20Jawaher%20Reception%20and%20Convention%20Centre!5e1!3m2!1sen!2seg!4v1792799915499!5m2!1sen!2seg" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" 
                        class="w-full h-full border-0 filter grayscale-[20%] contrast-[105%] group-hover:grayscale-0 transition-all duration-500" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade"
                        title="موقع القاعة">
                    </iframe>
                </div>

                <!-- Open Map Direct Button -->
                <div class="pt-2">
                    <a 
                        href="https://maps.app.goo.gl/2Sj3TARG3VqMp65m6" 
                        target="_blank" 
                        rel="noopener noreferrer"
                        class="gold-btn inline-flex items-center justify-center gap-3 text-black font-bold px-6 py-3 rounded-xl w-full sm:w-auto text-base sm:text-lg transition-all"
                    >
                        <i class="fa-solid fa-map-location-dot text-sm"></i>
                        <span>فتح الموقع في خرائط Google</span>
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 py-4 text-center text-xs text-amber-200/60 tracking-wider">
        <a 
            href="https://www.hakim1.com/" 
            target="_blank" 
            rel="noopener noreferrer"
            class="hover:text-amber-300 transition-colors duration-300 font-sans uppercase font-medium inline-block py-1 px-3 rounded-md hover:bg-white/5"
        >
            By HAKIM
        </a>
    </footer>

</body>
</html>
